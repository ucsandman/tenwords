<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Condense any text to exactly ten words per paragraph.">
<title>TenWords</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text x="50" y="76" font-size="80" text-anchor="middle" font-family="Georgia,serif" fill="%239c2f26">%C2%B6</text></svg>'>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfb;
    --surface: #ffffff;
    --ink: #1f1f1f;
    --muted: #595959;
    --line: #e2e2e2;
    --accent: #9c2f26;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1b;
      --surface: #212121;
      --ink: #e8e8e8;
      --muted: #a8a8a8;
      --line: #3a3a3a;
      --accent: #e08a7e;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; padding: 4rem 1.25rem 6rem; min-height: 100vh;
    font-family: Charter, 'Sitka Text', Cambria, Georgia, serif;
    font-size: 1.0625rem; line-height: 1.65;
    background: var(--bg); color: var(--ink);
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 40rem; }

  header { text-align: center; margin-bottom: 2.75rem; }
  h1 {
    margin: 0; font-size: 1.25rem; font-weight: 400;
    letter-spacing: 0.32em; text-transform: uppercase; text-indent: 0.32em;
  }
  h1 span { color: var(--muted); }
  .tag { margin: 0.5rem 0 0; font-size: 0.9375rem; font-style: italic; color: var(--muted); }

  .panel {
    border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
    overflow: hidden; transition: border-color 150ms ease-out;
  }
  .panel:focus-within { border-color: var(--muted); }
  .panel.drag { border-color: var(--accent); }
  textarea {
    display: block; width: 100%; min-height: 9.5rem; padding: 1rem 1.1rem;
    border: 0; outline: none; resize: vertical;
    background: none; color: inherit;
    font: inherit; font-size: 1rem; line-height: 1.6;
  }
  textarea::placeholder, input::placeholder { color: var(--muted); opacity: 1; }
  .alt { display: flex; align-items: stretch; border-top: 1px solid var(--line); }
  .alt input {
    flex: 1; min-width: 0; padding: 0.7rem 1.1rem;
    border: 0; outline: none; background: none; color: inherit;
    font: inherit; font-size: 0.9375rem;
  }
  .alt .sep { width: 1px; background: var(--line); }
  .filebtn {
    padding: 0.7rem 1.1rem; border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 0.9375rem; color: var(--muted); white-space: nowrap;
    transition: color 150ms ease-out;
  }
  .filebtn:hover { color: var(--ink); }

  .actions {
    display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; margin-top: 0.9rem;
  }
  #count { font-size: 0.875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .primary {
    position: relative; padding: 0.6rem 1.6rem; cursor: pointer;
    border: 1px solid var(--ink); border-radius: 6px;
    background: var(--ink); color: var(--bg);
    font: inherit; font-size: 0.9375rem;
    transition: opacity 150ms ease-out, transform 150ms ease-out;
  }
  .primary:hover:not(:disabled) { transform: translateY(-1px); }
  .primary:active:not(:disabled) { transform: none; }
  .primary:disabled { opacity: 0.55; cursor: default; }
  .primary.loading { padding-left: 2.5rem; }
  .primary.loading::before {
    content: ''; position: absolute; left: 1rem; top: 50%;
    width: 0.8rem; height: 0.8rem; margin-top: -0.45rem;
    border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%;
    animation: spin 700ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  :is(button, textarea, input, [tabindex]):focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .panel :is(textarea, input):focus-visible { outline: none; }

  #status {
    margin: 2.4rem 0 0; min-height: 1.5em; text-align: center;
    font-size: 0.9375rem; font-style: italic; color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  #status.error { color: var(--accent); font-style: normal; }

  #tldrwrap { margin: 3rem 0 0; padding-top: 2.4rem; border-top: 1px solid var(--line); text-align: center; scroll-margin-top: 1.5rem; }
  .lbl { margin: 0; font-size: 0.8125rem; font-weight: 400; letter-spacing: 0.18em; text-transform: uppercase; text-indent: 0.18em; color: var(--muted); }
  #tldr { margin: 0.7rem auto 0; max-width: 34rem; font-size: 1.3125rem; line-height: 1.55; font-style: italic; text-wrap: balance; }

  .resmeta {
    display: flex; justify-content: space-between; align-items: baseline;
    margin: 2.8rem 0 0.4rem; font-size: 0.875rem; color: var(--muted);
  }
  #copy {
    border: 0; background: none; cursor: pointer;
    font: inherit; font-size: 0.875rem; color: var(--muted);
    text-decoration: underline; text-underline-offset: 3px;
    transition: color 150ms ease-out;
  }
  #copy:hover { color: var(--ink); }

  #lines p { margin: 1.9rem 0; padding-left: 1.6em; text-indent: -1.6em; font-size: 1.125rem; line-height: 1.7; }
  #lines p::before { content: '¶'; display: inline-block; width: 1.6em; text-indent: 0; color: var(--accent); opacity: 0.6; }

  .skel {
    height: 1.05rem; margin: 1.9rem 0 1.9rem 1.8em; border-radius: 3px; background: var(--line);
    animation: pulse 1.1s ease-in-out infinite alternate;
  }
  .tldr-skel { width: 60%; height: 1.2rem; margin: 1rem auto 0.4rem; }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }

  .reveal { animation: rise 250ms ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .skel, .reveal, .primary.loading::before { animation: none; }
    .primary, .filebtn, #copy, .panel { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Ten<span>Words</span></h1>
    <p class="tag">Every paragraph in exactly ten words.</p>
  </header>

  <form id="form">
    <div class="panel" id="panel">
      <textarea id="text" aria-label="Text to condense" placeholder="Paste anything: a Claude or ChatGPT answer, an article, notes…"></textarea>
      <div class="alt">
        <input type="url" id="url" aria-label="Article URL" placeholder="…or an article link">
        <div class="sep"></div>
        <button type="button" class="filebtn" id="choose">or a PDF, docx, txt</button>
      </div>
    </div>
    <input type="file" id="file" accept=".pdf,.docx,.txt" hidden>
    <div class="actions">
      <span id="count"></span>
      <button type="submit" class="primary" id="go">Condense</button>
    </div>
  </form>

  <p id="status" role="status" aria-live="polite"></p>

  <section id="tldrwrap" hidden>
    <h2 class="lbl">TL;DR</h2>
    <p id="tldr"></p>
  </section>
  <div class="resmeta" id="resmeta" hidden>
    <span id="restotal"></span>
    <button type="button" id="copy">Copy summary</button>
  </div>
  <div id="lines"></div>
</main>
<script>
  const $ = id => document.getElementById(id)
  const statusEl = $('status')
  let timer = null

  const words = t => t.trim() ? t.trim().split(/\s+/).length : 0
  const fmt = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg
    statusEl.className = isError ? 'error' : ''
  }

  function stopTimer() { clearInterval(timer); timer = null }

  function clearResults() {
    $('tldrwrap').hidden = true
    $('tldrwrap').querySelector('.skel')?.remove()
    $('resmeta').hidden = true
    $('lines').textContent = ''
  }

  const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches

  function buildScaffold(blocks) {
    $('tldr').textContent = ''
    const tskel = document.createElement('div')
    tskel.className = 'skel tldr-skel'
    tskel.setAttribute('aria-hidden', 'true')
    $('tldrwrap').appendChild(tskel)
    $('tldrwrap').hidden = false

    const before = blocks.reduce((n, b) => n + words(b.text), 0)
    $('restotal').textContent = `${blocks.length} paragraph${blocks.length === 1 ? '' : 's'}, ${before.toLocaleString()} words → ${blocks.length * 10 + 10}`
    $('copy').hidden = true
    $('resmeta').hidden = false

    const widths = [92, 78, 88, 70, 84, 95, 74, 90]
    blocks.forEach((b, i) => {
      const d = document.createElement('div')
      d.className = 'skel'
      d.setAttribute('aria-hidden', 'true')
      d.dataset.id = b.id
      d.style.width = widths[i % widths.length] + '%'
      $('lines').appendChild(d)
    })
  }

  function fillLine(summary, indexInBatch) {
    const skel = $('lines').querySelector(`.skel[data-id="${summary.id}"]`)
    if (!skel) return
    const p = document.createElement('p')
    p.textContent = summary.text
    p.className = 'reveal'
    p.style.animationDelay = `${Math.min(indexInBatch * 30, 300)}ms`
    skel.replaceWith(p)
  }

  async function jsonOrThrow(res) {
    const body = await res.json().catch(() => ({}))
    if (!res.ok) throw new Error(body.error || `request failed (${res.status})`)
    return body
  }

  async function run(extractBody) {
    const go = $('go')
    go.disabled = true
    go.classList.add('loading')
    clearResults()
    try {
      setStatus('Reading…')
      const { blocks } = await jsonOrThrow(await fetch('/extract', extractBody))
      if (!blocks.length) throw new Error('No paragraphs long enough to condense were found.')
      buildScaffold(blocks)
      const t0 = Date.now()
      let filled = 0
      const tick = () => setStatus(`Condensing · ${filled}/${blocks.length} paragraph${blocks.length === 1 ? '' : 's'} · ${fmt(Math.round((Date.now() - t0) / 1000))}`)
      tick()
      timer = setInterval(tick, 1000)
      const res = await fetch('/summarize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/x-ndjson' },
        body: JSON.stringify({ blocks }),
      })
      if (!res.ok) await jsonOrThrow(res)
      const reader = res.body.getReader()
      const decoder = new TextDecoder()
      let buf = ''
      let scrolled = false
      let finished = false
      while (true) {
        const { done: eof, value } = await reader.read()
        if (eof) break
        buf += decoder.decode(value, { stream: true })
        const lines = buf.split('\n')
        buf = lines.pop()
        for (const line of lines) {
          if (!line.trim()) continue
          const event = JSON.parse(line)
          if (event.type === 'batch') {
            event.summaries.forEach(fillLine)
            filled += event.summaries.length
            tick()
            if (!scrolled) {
              scrolled = true
              $('tldrwrap').scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'start' })
            }
          } else if (event.type === 'tldr') {
            $('tldrwrap').querySelector('.skel')?.remove()
            $('tldr').textContent = event.tldr
            $('tldr').classList.add('reveal')
          } else if (event.type === 'error') {
            throw new Error(event.error)
          } else if (event.type === 'done') {
            finished = true
          }
        }
      }
      if (!finished) throw new Error('The service stopped responding mid-condense.')
      stopTimer()
      $('copy').hidden = false
      setStatus('')
    } catch (err) {
      stopTimer()
      clearResults()
      setStatus(err.message, true)
    } finally {
      go.disabled = false
      go.classList.remove('loading')
    }
  }

  $('form').addEventListener('submit', e => {
    e.preventDefault()
    const text = $('text').value.trim()
    const url = $('url').value.trim()
    if (text) {
      return run({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) })
    }
    if (!url) return setStatus('Paste some text, a link, or drop a file first.', true)
    run({ method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) })
  })

  $('text').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault()
      $('form').requestSubmit()
    }
  })
  $('text').addEventListener('input', () => {
    const t = $('text').value
    const w = words(t)
    const paras = t.split(/\r?\n\s*\r?\n/).filter(p => p.trim()).length
    $('count').textContent = w ? `${w.toLocaleString()} words · ${paras} paragraph${paras === 1 ? '' : 's'}` : ''
  })

  function sendFile(file) {
    const form = new FormData()
    form.append('file', file, file.name)
    run({ method: 'POST', body: form })
  }
  $('choose').addEventListener('click', () => $('file').click())
  $('file').addEventListener('change', () => $('file').files[0] && sendFile($('file').files[0]))

  const panel = $('panel')
  panel.addEventListener('dragover', e => { e.preventDefault(); panel.classList.add('drag') })
  panel.addEventListener('dragleave', () => panel.classList.remove('drag'))
  panel.addEventListener('drop', e => {
    e.preventDefault()
    panel.classList.remove('drag')
    if (e.dataTransfer.files[0]) sendFile(e.dataTransfer.files[0])
  })
  document.addEventListener('dragover', e => e.preventDefault())
  document.addEventListener('drop', e => e.preventDefault())

  $('copy').addEventListener('click', async () => {
    const out = [`TL;DR: ${$('tldr').textContent}`, ...[...$('lines').querySelectorAll('p')].map(p => p.textContent)].join('\n\n')
    try {
      await navigator.clipboard.writeText(out)
      $('copy').textContent = 'Copied'
    } catch {
      $('copy').textContent = 'Copy failed'
    }
    setTimeout(() => { $('copy').textContent = 'Copy summary' }, 1500)
  })
</script>
</body>
</html>
